# Fast deterministic development preset. See docs/kiselev_geodesic_shooting.md
# for the S2-like production example.
seed: 2026
mode: quick
M: 1.0
k_values: [0.0, 0.001]
wq_values: [-0.5]
orbit_preset: compact_test
r_p: 8.0
r_a: 12.0
phi_start: 3.141592653589793
phi_end: 3.3415926535897933
n_emission_phases: 5
inclination_deg: 135.0
omega_deg: 65.0
Omega_deg: 225.0
observer_x: 0.0
observer_y: 0.0
observer_z: -80.0
emitter_rtol: 1.0e-11
emitter_atol: 1.0e-13
photon_rtol: 1.0e-10
photon_atol: 1.0e-12
photon_max_step: 4.0
photon_max_affine_parameter: 200.0
root_method: least_squares
root_tolerance: 1.0e-10
hit_tolerance: 1.0e-5
use_continuation: true
reference_phase: 3.141592653589793
detailed_output_csv: artifacts/kiselev_shooting/detailed.csv
summary_output_csv: artifacts/kiselev_shooting/summary.csv
diagnostics_output_csv: artifacts/kiselev_shooting/diagnostics.csv
figures_output_directory: artifacts/kiselev_shooting/figures
