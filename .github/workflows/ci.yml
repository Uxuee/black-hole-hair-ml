name: tests

on:
  push:
  pull_request:

jobs:
  unit-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10.9"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Install Tectonic
        env:
          TECTONIC_VERSION: "0.15.0"
        run: |
          curl --fail --location --retry 3 --output /tmp/tectonic.tar.gz \
            "https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%40${TECTONIC_VERSION}/tectonic-${TECTONIC_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          tar --extract --gzip --file /tmp/tectonic.tar.gz --directory /tmp tectonic
          sudo install -m 0755 /tmp/tectonic /usr/local/bin/tectonic
          tectonic --version
      - name: Unit tests
        run: python -m pytest -m "not smoke"
      - name: Smoke tests
        run: python -m pytest -m smoke
